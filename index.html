<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExecutionOS</title>
</head>
<body>
    <div class="plan-screen screen">
        <section class="header-section">
            <h1>ExecutionOS</h1>
            <p>ExecutionOS helps ambitious builders who already know what they should be doing but struggle to execute consistently on meaningful goals and projects.</p>
        </section>
        <section class="mission-section">
            <h3>What Matters Today?</h3>
            <input type="text" placeholder="Today's Mission" class="input" id="mission-input">
        </section>
        <section class="time-section">
            <h3>How long will you focus?</h3>
            <input type="text" placeholder="hh:mm" class="input" id="time-input">
        </section>
        <section class="action-section">
            <button id="start-work-btn">START WORK</button>
        </section>
    </div>
    <div class="focus-screen screen">
        <p id="mission-display"></p>
        <p id="target-time-display"></p>
        <section class="timer-section">
            <p id="timer">00:00:00</p>
        </section>
        <section class="action-section">
            <button id="pause-btn">Pause</button>
            <button id="stop-btn">Stop</button>
        </section>
    </div>
</body>
<script src="app.js"></script>
</html>
